# Approval policy: what merges on one review, what gets a deeper review, what a repository owner decides.
# The same file in every repository, rendered from one table: never edit it by hand.
# Didit's merge process applies it. It is not the configuration of any review bot, model or coding tool.
# Not written here because no path says it: a changed price number and a removed redirect always go to an owner; the size
# rule leaves generated files out; names are read as whole words there and as the closest patterns here.
# Every review answers the questions below, and one yes goes to an owner. A pull request from a fork always goes to an owner.
version: 1
tiers:
  auto:
    means: "Every other change merges on one approving review of its exact commit and green checks."
  deep:
    means: "One review by the strongest model: money, access, customer data, fraud decisions, migrations, deploys, CI, shared rules, native SDK source, or a change larger than 100 files or 2500 lines."
