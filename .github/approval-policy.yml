questions:
  - "Does it change what a customer pays, who is charged, when, or what is free?"
  - "Does it delete customer data, keep it longer, or show or send it to someone new?"
  - "Does it weaken sign-in, permissions, two-factor, rate limits, or a fraud, liveness or face-match decision?"
  - "Does it put a supplier's name, a public or compliance claim, or a published address in front of a customer, or change one?"
  - "Does it open, close or redesign a product, a flag default, a country or a screen for every customer, with no approved design named in the pull request?"
  - "Does it touch infrastructure, access keys, secrets, or the rules that decide what merges and deploys?"
