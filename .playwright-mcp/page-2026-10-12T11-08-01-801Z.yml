  - generic [ref=e150]:
    - heading "didit-sdk-integration / SKILL.md" [level=1] [ref=e151]
    - heading "Didit SDK Integration (Web, iOS, Android, React Native, Flutter)" [level=1] [ref=e152]
    - heading "Overview" [level=2] [ref=e153]
    - paragraph [ref=e154]: Your backend uses the API key to create what the client needs; the client only ever holds a short-lived credential for one purpose. This skill is organized by product.
    - table [ref=e155]:
      - rowgroup [ref=e156]:
        - row [ref=e157]:
          - columnheader "Product" [ref=e158]
          - columnheader "Backend call (API key)" [ref=e159]
          - columnheader "Client receives" [ref=e160]
          - columnheader "Client SDK call" [ref=e161]
      - rowgroup [ref=e162]:
        - row [ref=e163]:
          - cell "Verification sessions" [ref=e164]
          - cell [ref=e165]:
            - code [ref=e166]: POST /v3/session/
          - cell [ref=e167]:
            - code [ref=e168]: url
            - text: (web) or
            - code [ref=e169]: session_token
            - text: (iOS, Android, React Native, Flutter)
          - cell [ref=e170]:
            - code [ref=e171]: startVerification
        - row [ref=e172]:
          - cell "Transactions" [ref=e173]
          - cell [ref=e174]:
            - code [ref=e175]: POST /v3/transactions/sdk-token/
          - cell [ref=e176]:
            - code [ref=e177]: sdk_token
          - cell [ref=e178]:
            - code [ref=e179]: submitTransaction
            - text: ", plus"
            - code [ref=e180]: getTransaction
            - text: on mobile
        - row [ref=e181]:
          - cell "Events" [ref=e182]
          - cell [ref=e183]:
            - code [ref=e184]: POST /v3/events/sdk-token/
          - cell [ref=e185]:
            - code [ref=e186]: monitoring_token
          - cell [ref=e187]:
            - text: "None: plain HTTPS to"
            - code [ref=e188]: POST /v1/events/
    - paragraph [ref=e189]:
      - strong [ref=e190]: "Rules:"
    - list [ref=e191]:
      - listitem [ref=e192]: Never put the API key in a browser, app or WebView. It stays on your backend.
      - listitem [ref=e193]:
        - text: SDK results are UX hints. Grant access only after your backend confirms the outcome with a webhook or
        - code [ref=e194]: "GET /v3/session/{session_id}/decision/"
        - text: (sessions) or
        - code [ref=e195]: "GET /v3/transactions/{uuid}/"
        - text: (transactions).
      - listitem [ref=e196]: Colors, logo and intro screens come from the console White Label settings, not from SDK options.
    - paragraph [ref=e197]:
      - strong [ref=e198]: "Versions documented here:"
      - text: Web SDK 0.4.0, iOS 4.9.1, Android 4.9.1, React Native 4.9.1, Flutter 4.9.1.
    - paragraph [ref=e199]:
      - strong [ref=e200]: "Pricing:"
      - text: The SDKs have no list price of their own. A session bills the features of its workflow (only features that finish); a transaction submitted from a device bills like a server-side one ($0.02 Transaction Screening). These are the list prices until 1 November 2026, when Didit pricing changes and the 500 free checks a month become $10 of free credit a month. Check
      - link "didit.me/pricing" [ref=e201] [cursor=pointer]:
        - /url: https://didit.me/pricing
      - text: for current prices.
    - paragraph [ref=e202]:
      - strong [ref=e203]: "Docs:"
      - text: "https://docs.didit.me/integration/sdks · Web: https://docs.didit.me/integration/web-sdks/javascript-sdk · Native: https://docs.didit.me/integration/native-sdks/overview · Transactions from the device: https://docs.didit.me/transaction-monitoring/sdk-transaction-submission · Events from the device: https://docs.didit.me/transaction-monitoring/sdk-event-submission"
    - separator [ref=e204]
    - heading "Authentication" [level=2] [ref=e205]
    - paragraph [ref=e206]:
      - text: Every backend request needs the
      - code [ref=e207]: x-api-key
      - text: header. Use your application's API key from the
      - link "Didit Business Console" [ref=e208] [cursor=pointer]:
        - /url: https://business.didit.me
      - text: under
      - strong [ref=e209]: Developers > API keys
      - text: ", or create an account and key programmatically (see Getting Started). Named keys with custom access need"
      - strong [ref=e210]: Sessions
      - text: write to create sessions (a key without it gets
      - code [ref=e211]: url
      - text: and
      - code [ref=e212]: session_token
      - text: back as
      - code [ref=e213]: "null"
      - text: ) and
      - strong [ref=e214]: Transactions
      - text: write to mint transaction or monitoring tokens; a key limited to some workflows can only create sessions for those workflows and cannot mint tokens.
    - paragraph [ref=e215]:
      - text: The device-facing
      - code [ref=e216]: /v1/
      - text: "endpoints never take the API key: they take"
      - code [ref=e217]: X-Transaction-Token
      - text: or
      - code [ref=e218]: X-Monitoring-Token
      - text: .
    - heading "Getting Started (No Account Yet?)" [level=2] [ref=e219]
    - paragraph [ref=e220]: "If you don't have a Didit API key, create one in 2 API calls:"
    - list [ref=e221]:
      - listitem [ref=e222]:
        - strong [ref=e223]: "Register:"
        - code [ref=e224]: POST https://apx.didit.me/auth/v2/programmatic/register/
        - text: with
        - code [ref=e225]: "{\"email\": \"you@yourdomain.com\", \"password\": \"MyStr0ng!Pass\"}"
      - listitem [ref=e226]:
        - strong [ref=e227]: Check email
        - text: for a 6-character verification code
      - listitem [ref=e228]:
        - strong [ref=e229]: "Verify:"
        - code [ref=e230]: POST https://apx.didit.me/auth/v2/programmatic/verify-email/
        - text: with
        - code [ref=e231]: "{\"email\": \"you@yourdomain.com\", \"code\": \"A3K9F2\"}"
        - text: . The key is in the response at
        - code [ref=e232]: application.api_key
        - text: .
    - paragraph [ref=e233]:
      - strong [ref=e234]: "To add credits:"
      - code [ref=e235]: GET /v3/billing/balance/
      - text: to check,
      - code [ref=e236]: POST /v3/billing/top-up/
      - text: with
      - code [ref=e237]: "{\"amount_in_dollars\": 50}"
      - text: for a Stripe checkout link.
    - paragraph [ref=e238]:
      - text: See the
      - strong [ref=e239]: didit-verification-management
      - text: skill for full platform management (workflows, sessions, users, billing).
